[build-system]
requires = [
    "setuptools>=80",
    "setuptools-scm[simple]>=8",
    "wheel"
]
build-backend = "setuptools.build_meta"

[project]
name = "anny"
dynamic = ["version"]
authors = [
    { name = "Romain Brégier", email = "romain.bregier@naverlabs.com" }
]
description="A parametric body model based on MakeHuman for PyTorch."
readme = "README.md"
license-files = ["LICENSE", "LICENSE_THINGS"]
requires-python = ">=3.10"

dependencies = [
    "torch>=2.0.0",
    "roma>=1.5.7",
    "numpy",
    "pyyaml",
    "pillow",
    "requests",
    "safetensors",
    "trimesh"
]

[tool.setuptools_scm]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
"anny" = ["data/*"]

[project.optional-dependencies]
examples = [
    "gradio",
    "jsonargparse",
    "matplotlib>=3.10.9",
    "ipykernel",
    "notebook",
    "scipy",
    "jupytext",
    "py-soma-x==0.1.0"
]
warp = [
    "warp-lang"
]
smpl = [
    "smplx",
    "chumpy"
]
cu126 = ["torch"]

[tool.uv.extra-build-dependencies]
chumpy = ["pip"]

[tool.uv.sources]
torch = { index = "torch-cu126", extra = "cu126" }

[[tool.uv.index]]
name = "torch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true